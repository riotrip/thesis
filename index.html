<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Thesis · Aplikasi</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fff;
      --ink: #191919;
      --muted: #686868;
      --rule: #e4e4e4;
      --soft: #f7f7f5;
      --accent: #62695d;
      font-family: 'Inter Tight Variable', 'Inter Tight', 'Helvetica Neue', Arial, sans-serif;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-size: 15px; line-height: 1.6; }
    ::selection { color: var(--paper); background: var(--accent); }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .skip-link { position: absolute; top: 12px; left: 12px; padding: 8px 12px; background: var(--ink); color: var(--paper); transform: translateY(-160%); }
    .skip-link:focus { transform: translateY(0); }
    .shell { width: min(100% - 64px, 1040px); margin-inline: auto; }
    header { padding-top: 48px; }
    h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.3; letter-spacing: -.025em; }
    header p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    main { padding-block: 36px 40px; }
    .apps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .app { display: grid; grid-template-columns: 24px minmax(0, 1fr) 16px; align-items: start; gap: 12px; padding: 20px; border: 1px solid var(--rule); border-radius: 12px; }
    .app:hover { background: var(--soft); border-color: var(--accent); }
    .app h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.5; }
    .app p { margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
    svg { width: 24px; height: 24px; stroke: var(--accent); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { width: 16px; height: 16px; margin-top: 4px; }
    @media (max-width: 800px) {
      .apps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .shell { width: calc(100% - 40px); }
      header { padding-top: 36px; }
      .apps { grid-template-columns: 1fr; gap: 12px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke isi</a>
  <header class="shell">
    <h1>Thesis</h1>
    <p>Akses catatan, data, dan aplikasi pendukung penelitian.</p>
  </header>
  <main id="main" class="shell">
    <nav class="apps" aria-label="Aplikasi">
      <!-- apps -->
    </nav>
  </main>
</body>
</html>
